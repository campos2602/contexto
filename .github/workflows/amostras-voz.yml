name: Amostras de voz (temporário)

# Grava a mesma notícia com vozes de podcast para o Luiz comparar. Sai do repositório antes do merge.
on:
  push:
    branches: [claude/project-thread-ugjtwf]
    paths: [".github/workflows/amostras-voz.yml", "amostras-voz/texto.txt", "amostras-voz/gerar.py", "amostras-voz/gatilho"]

permissions:
  contents: write

jobs:
  amostras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/project-thread-ugjtwf
      - name: Gravar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          ls amostras-voz/*.mp3 >/dev/null 2>&1 && { echo "Já gravadas."; exit 0; }
          python3 amostras-voz/gerar.py
      - name: Gravar no branch
        run: |
          git config user.name "contexto-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amostras-voz/*.mp3 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Amostras de voz de podcast"
          git push origin HEAD:claude/project-thread-ugjtwf
