name: Amostras de voz (temporário)

# Grava a mesma notícia em várias vozes para o Luiz comparar. Sai do repositório antes do merge.
on:
  push:
    branches: [claude/project-thread-ugjtwf]
    paths: [".github/workflows/amostras-voz.yml", "amostras-voz/texto.txt"]

permissions:
  contents: write

jobs:
  amostras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar
        run: |
          pip install -q edge-tts piper-tts
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Microsoft (edge-tts)
        continue-on-error: true
        run: |
          cd amostras-voz
          for v in FranciscaNeural AntonioNeural ThalitaMultilingualNeural; do
            edge-tts --voice pt-BR-$v -f texto.txt --write-media "microsoft-$v.mp3" || true
          done
      - name: Piper (código aberto, roda offline)
        continue-on-error: true
        run: |
          cd amostras-voz
          b=https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR
          for v in faber/medium/pt_BR-faber-medium cadu/medium/pt_BR-cadu-medium; do
            n=$(basename $v); curl -sSLf -o $n.onnx $b/$v.onnx && curl -sSLf -o $n.onnx.json $b/$v.onnx.json || continue
            python -m piper -m $n.onnx -f $n.wav < texto.txt && ffmpeg -loglevel error -y -i $n.wav -b:a 64k "piper-$n.mp3"
            rm -f $n.onnx $n.onnx.json $n.wav
          done
      - name: Gravar no branch
        run: |
          ls -la amostras-voz
          git config user.name "contexto-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amostras-voz/*.mp3 || true
          git diff --cached --quiet && exit 0
          git commit -m "Amostras de voz"
          git push origin HEAD:${{ github.ref_name }}
