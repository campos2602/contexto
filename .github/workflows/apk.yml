name: Gerar APK Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Renomear
        run: cp android/app/build/outputs/apk/debug/app-debug.apk contexto.apk
      - name: Publicar na página de versões
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Contexto para Android (versão ${{ github.run_number }})
          body: Baixe o arquivo contexto.apk no celular Android e abra para instalar.
          files: contexto.apk
