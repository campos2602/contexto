name: Testar o app no emulador

on:
  pull_request:
    paths: ["android/**", ".github/workflows/apk.yml", ".github/workflows/teste-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  telas:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compilar
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon && cp app/build/outputs/apk/release/app-release.apk ../contexto.apk
      - name: Ligar a aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abrir o app no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash android/teste/telas.sh
      - name: Guardar as capturas
        if: always()
        run: cd telas && zip -q ../telas.zip *
      - name: Guardar no rascunho de versão
        if: always() && github.event_name == 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-teste-pr${{ github.event.pull_request.number }}
          target_commitish: ${{ github.event.pull_request.head.sha }}
          draft: true
          overwrite_files: true
          files: telas.zip
