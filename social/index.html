<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Kit de redes · Contexto</title>
<link rel="icon" href="../icones/favicon-64.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Página do editor: pega o carrossel, o story e as legendas do dia para postar. Não aparece no Google. */
:root { --bg: #eef1f3; --surface: #fff; --ink: #121821; --muted: #5a6573; --line: #d5dbe1; --accent: #0b7a75; }
@media (prefers-color-scheme: dark) { :root { --bg: #0c1117; --surface: #151c25; --ink: #e8edf2; --muted: #9aa6b4; --line: #2a3441; --accent: #3cc7bd; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Schibsted Grotesk", Arial, sans-serif; }
main { max-width: 900px; margin: 0 auto; padding: 20px 16px 60px; display: grid; gap: 22px; }
h1 { margin: 0; font-size: 28px; } h2 { margin: 0; font-size: 20px; }
p { margin: 0; color: var(--muted); line-height: 1.5; }
.kit > * { min-width: 0; }
.kit { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; }
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.grade a { display: block; } .grade img { width: 100%; border-radius: 8px; border: 1px solid var(--line); display: block; }
pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: "IBM Plex Mono", monospace; font-size: 13px; background: var(--bg); border-radius: 8px; padding: 12px; }
button { font: inherit; font-weight: 600; font-size: 15px; min-height: 40px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--accent); background: none; color: var(--accent); cursor: pointer; justify-self: start; }
select { font: inherit; font-size: 16px; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
</style>
</head>
<body>
<main>
<h1>Kit de redes do Contexto</h1>
<p>Tudo que sai em cada edição para Instagram, LinkedIn e WhatsApp. No celular, toque e segure numa imagem para salvar; no computador, clique para abrir e salve. Depois copie a legenda.</p>
<label><select id="dia" aria-label="Edição"></select></label>
<div id="kit"></div>
<section class="kit" id="lanc"><h2>Posts fixos de abertura do perfil</h2><p>Para os 3 primeiros posts do Instagram, nesta ordem.</p><div class="grade" id="lanc-g"></div><div id="lanc-t"></div></section>
</main>
<script>
(function () {
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function texto(u) { return fetch(u, { cache: "no-cache" }).then(function (r) { return r.ok ? r.text() : ""; }); }
  function bloco(titulo, t) { return t ? '<h2>' + esc(titulo) + '</h2><pre>' + esc(t) + '</pre><button type="button" data-copiar>Copiar</button>' : ""; }
  document.addEventListener("click", function (e) {
    if (!e.target.hasAttribute("data-copiar")) return;
    var t = e.target.previousElementSibling.textContent;
    navigator.clipboard.writeText(t).then(function () { e.target.textContent = "Copiado"; setTimeout(function () { e.target.textContent = "Copiar"; }, 1500); });
  });
  var VIDEO = "https://github.com/campos2602/contexto/releases/download/kit-redes/reels.mp4", ULTIMO = null;
  function mostrar(k) {
    var imgs = k.arquivos.filter(function (a) { return /\.(png|jpg)$/.test(a); });
    Promise.all([texto(k.id + "/legenda.txt"), texto(k.id + "/whatsapp.txt")]).then(function (t) {
      document.getElementById("kit").innerHTML = '<section class="kit"><h2>Carrossel e story</h2><div class="grade">' +
        imgs.map(function (a) { return '<a href="' + k.id + "/" + a + '" target="_blank"><img src="' + k.id + "/" + a + '" alt="' + esc(a) + '" loading="lazy"></a>'; }).join("") + "</div>" +
        (k === ULTIMO ? '<h2>Vídeo para Reels, TikTok e Shorts</h2><p>Sem som: escolha a música na biblioteca da rede na hora de postar. Use a mesma legenda.</p><a href="' + VIDEO + '"><button type="button">Baixar o vídeo do dia</button></a>' : "") +
        bloco("Legenda do Instagram e LinkedIn", t[0]) + bloco("Em 30 segundos, para o WhatsApp", t[1]) + "</section>";
    });
  }
  fetch("kits.json", { cache: "no-cache" }).then(function (r) { return r.json(); }).then(function (kits) {
    var sel = document.getElementById("dia");
    sel.innerHTML = kits.map(function (k, i) { return '<option value="' + i + '">' + esc(k.id) + "</option>"; }).join("");
    sel.addEventListener("change", function () { mostrar(kits[+sel.value]); });
    ULTIMO = kits[0] || null;
    if (kits[0]) mostrar(kits[0]);
  });
  var L = ["post-1-o-que-e", "post-2-como-fazemos", "post-3-escrito-por-ia"];
  document.getElementById("lanc-g").innerHTML = L.map(function (n) { return '<a href="lancamento/' + n + '.png" target="_blank"><img src="lancamento/' + n + '.png" alt="' + n + '" loading="lazy"></a>'; }).join("");
  Promise.all(L.map(function (n) { return texto("lancamento/" + n + ".txt"); })).then(function (t) {
    document.getElementById("lanc-t").innerHTML = t.map(function (x, i) { return bloco("Legenda do post " + (i + 1), x); }).join("");
  });
})();
</script>
</body>
</html>
